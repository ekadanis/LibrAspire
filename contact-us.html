<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #a8d5f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .page-header {
            background: linear-gradient(135deg, #2c5aa0 0%, #1e3f5a 100%);
            height: 50px;
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            padding: 0 30px;
            border-radius: 12px;
        }

        .page-header h1 {
            color: white;
            font-size: 20px;
            margin: 0;
            margin-right: auto;
        }

        .page-header a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
            font-size: 14px;
            transition: opacity 0.3s ease;
        }

        .page-header a:hover {
            opacity: 0.8;
        }

        body {
            padding-top: 110px;
        }

        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
        }

        .form-section {
            padding: 50px 40px;
        }

        .illustration-section {
            background-color: #f5f8fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            padding: 30px;
        }

        .illustration-section img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        h1 {
            color: #2c5aa0;
            margin-bottom: 35px;
            font-size: 36px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: none;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 15px 18px;
            border: none;
            border-radius: 8px;
            background-color: #e8f1f8;
            font-size: 16px;
            font-family: Arial, sans-serif;
            color: #2c5aa0;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #00b4d8;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0099b9;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div class="page-header">
        <h1>LibrAspire</h1>
        <a href='LibrAspire.html' style="font-weight: bold;">Home</a>
        <a href='catalog.html ' style="font-weight: bold;">Catalog</a>
        <a href='contact-us.html' style="font-weight: bold;">Contact</a>
    </div>
    <div class="container">
        <div class="illustration-section">
            <img src="contact-illust.png" alt="Contact us illustration">
        </div>
        <div class="form-section">
            <h1>Contact us</h1>
            <form>
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Name" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Message" required></textarea>
                </div>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </div>
</body>

</html>
